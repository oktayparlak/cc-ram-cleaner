<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">CC RAM Cleaner</title>
  <desc id="d">One button that frees RAM for Claude Code, Codex and OpenCode on Windows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1724"/>
      <stop offset="1" stop-color="#1b2a3f"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="1" stop-color="#27ae60"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- toggle -->
  <rect x="70" y="92" width="210" height="96" rx="18" fill="#2e7d32"/>
  <text x="175" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">ACTIVE</text>

  <!-- title -->
  <text x="320" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">CC RAM Cleaner</text>
  <text x="322" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a9b8cc">One button. More RAM for Claude Code, Codex &amp; OpenCode.</text>

  <!-- memory bars: before / after -->
  <text x="70" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#a9b8cc">background bloat</text>
  <rect x="250" y="232" width="880" height="24" rx="12" fill="#2b3a50"/>
  <rect x="250" y="232" width="560" height="24" rx="12" fill="#e67e22"/>
  <rect x="250" y="232" width="250" height="24" rx="12" fill="#5d8fd8"/>

  <text x="70" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#a9b8cc">agents get it back</text>
  <rect x="250" y="282" width="880" height="24" rx="12" fill="#2b3a50"/>
  <rect x="250" y="282" width="620" height="24" rx="12" fill="url(#free)"/>
  <rect x="250" y="282" width="250" height="24" rx="12" fill="#5d8fd8"/>

  <text x="1130" y="214" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a9b8cc"><tspan fill="#5d8fd8">■</tspan> Windows   <tspan fill="#e67e22">■</tspan> bloat   <tspan fill="#2ecc71">■</tspan> free for your agents</text>
</svg>
