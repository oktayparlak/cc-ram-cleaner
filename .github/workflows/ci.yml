name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CCRamCleaner.slnx
      - run: dotnet build CCRamCleaner.slnx -c Release --no-restore
      - run: dotnet test CCRamCleaner.slnx -c Release --no-build
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          dotnet publish src/CCRamCleaner.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/fd
          dotnet publish src/CCRamCleaner.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/sc
          Copy-Item publish/fd/CCRamCleaner.exe CCRamCleaner-win-x64.exe
          Copy-Item publish/sc/CCRamCleaner.exe CCRamCleaner-win-x64-selfcontained.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            CCRamCleaner-win-x64.exe
            CCRamCleaner-win-x64-selfcontained.exe
